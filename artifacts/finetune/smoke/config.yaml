model: mlx-community/Llama-3.2-3B-Instruct-4bit
train: true
data: data/processed/mlx
adapter_path: artifacts/finetune/smoke_ckpt/adapters
seed: 42
fine_tune_type: lora
mask_prompt: true
num_layers: 16
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.05
optimizer: adamw
batch_size: 4
grad_accumulation_steps: 2
iters: 30
learning_rate: 0.0001
lr_schedule:
  name: cosine_decay
  warmup: 5
  warmup_init: 1.0e-06
  arguments:
  - 0.0001
  - 30
  - 1.0e-06
max_seq_length: 1024
grad_checkpoint: true
steps_per_report: 5
steps_per_eval: 15
val_batches: 5
save_every: 30
