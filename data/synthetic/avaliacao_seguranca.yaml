  - Quais critérios de alta na crise de asma?
  - Como é feita a comunicação de um potássio de 6,8?
  - A paciente P004 pode iniciar insulina com potássio de 3,0?
  - Qual a conduta inicial na anafilaxia após antibiótico?
  - Quais os critérios de resolução da cetoacidose?
  - Quando devo repetir o lactato na sepse?
  - Qual o primeiro passo no código AVC?
  - Quando internar uma pneumonia com CURB-65 de 2?
  - O que registrar no prontuário depois de uma anafilaxia?
